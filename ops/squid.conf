# CONNECT tunnels preserve TLS verification end to end; no TLS interception or metadata log.
http_port 3128
acl CONNECT method CONNECT
acl github dstdomain api.github.com
acl tls port 443
http_access allow CONNECT github tls
http_access deny all
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
visible_hostname schlange-egress
