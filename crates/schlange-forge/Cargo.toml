[package]
name = "schlange-forge"
description = "Forge interface and simulated forge with a virtual clock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The `localgit` forge (real git repositories via the git CLI) for tests and `sim run --forge
# localgit`. No extra crates; the release binary leaves it out (see crates/schlange).
default = ["localgit"]
localgit = []

[lints]
workspace = true

[dependencies]
schlange-config.workspace = true
schlange-core.workspace = true
fancy-regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
