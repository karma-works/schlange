[package]
name = "schlange"
description = "Schlange: a merge queue as one static binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "schlange"
path = "src/main.rs"

[features]
# `schlange sim run --forge localgit`: needs git on the path; off in the release image,
# which ships no git.
localgit = ["schlange-forge/localgit"]

[lints]
workspace = true

[dependencies]
schlange-config.workspace = true
schlange-core.workspace = true
schlange-forge.workspace = true
schlange-github.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

[dev-dependencies]
# The CLI tests drive `sim run --forge localgit`.
schlange-forge = { workspace = true, features = ["localgit"] }
schlange-github-fake.workspace = true
ureq.workspace = true
