# Valid for Mergify; uses features Schlange has not built (exit 2 with --strict).
shared:
  ci: &ci
    - check-success = ci
queue_rules:
  - name: default
    merge_method: rebase
    merge_conditions: *ci
priority_rules:
  - name: hotfix
    conditions:
      - label = hotfix
    priority: high
pull_request_rules:
  - name: label
    conditions:
      - base = main
    actions:
      label:
        add: [ready]
