# Cascade (MQ-23, queue-speculation `cascade`): three cars run at once, each on top of the one
# before. #1 breaks the full suite, so cars 1, 2 and 3 all fail. Car 1 is at the front: #1 is
# dequeued, and cars 2 and 3 are discarded because they were built on #1 (BATCH_AHEAD_FAILED).
# They are rebuilt without #1 and land.
name: p1-cascade
description: A failing car discards every car behind it; those are rebuilt and land.
config: configs/two-step.yml

ci:
  - check: quick
    duration: 1m
    runs_on: pull_request
  - check: full
    duration: 10m
    runs_on: queue
    fail_when_contains: BROKEN

pull_requests:
  - { number: 1, author: bot, files: { a.txt: "BROKEN\n" } }
  - { number: 2, author: bot, files: { b.txt: "b\n" } }
  - { number: 3, author: bot, files: { c.txt: "c\n" } }

events:
  - { at: 0s, open: 1 }
  - { at: 5s, open: 2 }
  - { at: 10s, open: 3 }

expect:
  - { pr: 1, state: dequeued, reason: CHECKS_FAILED }
  - { pr: 2, state: merged }
  - { pr: 3, state: merged }
expect_merged_order: [2, 3]
expect_log:
  - "(checks #3)"
  - "checks of #2 ended, stays queued: BATCH_AHEAD_FAILED"
  - "checks of #3 ended, stays queued: BATCH_AHEAD_FAILED"
