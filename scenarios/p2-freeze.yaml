# A scheduled freeze (queue-freeze, MQ-46). From +0:00 to +0:40 a freeze holds back every pull
# request on main except those labeled both `hotfix` and `urgent` (exceptions are combined with
# AND). #2 carries both and lands as soon as its checks pass; #1 is checked too but waits green
# at the front until the freeze ends, then lands. #3 carries only `hotfix`, so it is frozen
# like #1 and lands after it.
name: p2-freeze
description: A freeze holds matching pull requests until it ends; exceptions let a hotfix through.
config: configs/two-step.yml

ci:
  - check: quick
    duration: 1m
    runs_on: pull_request
  - check: full
    duration: 10m
    runs_on: queue

pull_requests:
  - { number: 1, author: bot, files: { a.txt: "a\n" } }
  - { number: 2, author: bot, labels: [hotfix, urgent], files: { b.txt: "b\n" } }
  - { number: 3, author: bot, labels: [hotfix], files: { c.txt: "c\n" } }

events:
  - { at: 0s, freeze: { id: 7, reason: "release 2.0", start: 0s, end: 40m, matching: [base = main], exclude: [label = hotfix, label = urgent] } }
  - { at: 0s, open: 2 }
  - { at: 10s, open: 1 }
  - { at: 20s, open: 3 }

expect:
  - { pr: 1, state: merged }
  - { pr: 2, state: merged }
  - { pr: 3, state: merged }
expect_merged_order: [2, 1, 3]
expect_log:
  - "freeze 7 `release 2.0`"
  - "#2 merged"
