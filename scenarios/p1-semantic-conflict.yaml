# Semantic conflict (MQ-01, queue-conflicts `semantic-conflict`): #1 renames foo(), #2 adds a
# new call to foo(). Each is green alone and the files do not conflict, but the full suite fails
# when both are present. Speculation tests car 1 = main + #1 and car 2 = main + #1 + #2; car 2
# fails. Once car 1 has landed, car 2 is the front and its failure is #2's: #2 leaves with
# CHECKS_FAILED, main never holds both.
name: p1-semantic-conflict
description: Two pull requests green alone and red together; the second one is dequeued.
config: configs/two-step.yml

ci:
  - check: quick
    duration: 1m
    runs_on: pull_request
  - check: full
    duration: 10m
    runs_on: queue
    fail_when_all: [RENAMED_FOO, CALLS_FOO]

pull_requests:
  - { number: 1, author: bot, title: Rename foo, files: { lib.rs: "fn bar() {} // RENAMED_FOO\n" } }
  - { number: 2, author: bot, title: Call foo, files: { app.rs: "fn main() { foo() } // CALLS_FOO\n" } }
  - { number: 3, author: bot, title: Unrelated, files: { docs.md: "docs\n" } }

events:
  - { at: 0s, open: 1 }
  - { at: 10s, open: 2 }
  - { at: 20s, open: 3 }

expect:
  - { pr: 1, state: merged }
  - { pr: 2, state: dequeued, reason: CHECKS_FAILED }
  - { pr: 3, state: merged }
expect_merged_order: [1, 3]
expect_base:
  lib.rs: "fn bar() {} // RENAMED_FOO\n"
expect_log:
  - "(checks #2)"
  - "BATCH_AHEAD_FAILED"
