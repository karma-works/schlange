# This scenario mirrors Arztagent's current informational Journeys exception.
# #1/#2: the umbrella and a numbered shard fail under GitHub Actions and land.
# #3: a valid shard from another app is not exempt. #4: shard 5/4 is a near miss.
# #5: an unrelated red check remains blocking.
name: p1-arztagent-journeys-informational
description: A red Journeys check does not hold a pull request; any other red check does.
config: configs/arztagent-journeys-informational.yml

ci:
  - app: github-actions
    check: Risk class and data protection
    duration: 1m
  - app: github-actions
    check: ci-ok
    duration: 3m
    runs_on: pull_request
  - app: github-actions
    check: ci-ok
    duration: 20m
    runs_on: queue
  - app: github-actions
    check: KI-Review
    duration: 5m
    runs_on: pull_request
  - app: github-actions
    check: verify-arztagent journeys
    duration: 8m
    runs_on: pull_request
    fail_when_prs: [1]
  - app: github-actions
    check: verify-arztagent journeys (1/4)
    duration: 8m
    runs_on: pull_request
    fail_when_prs: [2]
  - app: other-app
    check: verify-arztagent journeys (2/4)
    duration: 2m
    runs_on: pull_request
    fail_when_prs: [3]
  - app: github-actions
    check: verify-arztagent journeys (5/4)
    duration: 2m
    runs_on: pull_request
    fail_when_prs: [4]
  - app: github-actions
    check: Scanners
    duration: 2m
    runs_on: pull_request
    fail_when_prs: [5]

pull_requests:
  - number: 1
    author: arztagent-bot
    files: { backend/a.py: "a = 1\n" }
  - number: 2
    author: arztagent-bot
    files: { backend/b.py: "b = 1\n" }
  - number: 3
    author: karma-works
    files: { docs/c.md: "c\n" }
  - number: 4
    author: karma-works
    files: { docs/d.md: "d\n" }
  - number: 5
    author: arztagent-bot
    files: { backend/e.py: "e = 1\n" }

events:
  - { at: 0s, open: 1 }
  - { at: 0s, open: 2 }
  - { at: 0s, open: 3 }
  - { at: 0s, open: 4 }
  - { at: 0s, open: 5 }

expect:
  - { pr: 1, state: merged, queue: default }
  - { pr: 2, state: merged, queue: default }
  - { pr: 3, state: open, queued: false }
  - { pr: 4, state: open, queued: false }
  - { pr: 5, state: open, queued: false }
expect_merged_order: [1, 2]
expect_log:
  - "check `verify-arztagent journeys` completed"
  - "check `verify-arztagent journeys (1/4)` completed"
