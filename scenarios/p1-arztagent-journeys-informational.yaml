# This test derivative expands the source snapshot's Journeys regex to exempt both bare and
# @github-actions/ names. The unchanged source snapshot's bare exemption does not exempt
# app-qualified failures; e2e_arztagent covers that actual-source behavior separately.
# #1: only Journeys fails and lands; #2/#3: Scanners fails and never enters.
name: p1-arztagent-journeys-informational
description: A red Journeys check does not hold a pull request; any other red check does.
config: configs/arztagent-journeys-informational.yml

ci:
  - app: github-actions
    check: Risk class and data protection
    duration: 1m
  - app: github-actions
    check: ci-ok
    duration: 3m
    runs_on: pull_request
  - app: github-actions
    check: ci-ok
    duration: 20m
    runs_on: queue
  - app: github-actions
    check: KI-Review
    duration: 5m
    runs_on: pull_request
  - app: github-actions
    check: verify-arztagent journeys
    duration: 8m
    runs_on: pull_request
  - app: github-actions
    check: Scanners
    duration: 2m
    runs_on: pull_request

pull_requests:
  - number: 1
    author: arztagent-bot
    files: { backend/a.py: "a = 1\n" }
    checks: { verify-arztagent journeys: failure }
  - number: 2
    author: arztagent-bot
    files: { backend/b.py: "b = 1\n" }
    checks: { Scanners: failure }
  - number: 3
    author: karma-works
    files: { docs/c.md: "c\n" }
    checks: { verify-arztagent journeys: failure, Scanners: failure }

events:
  - { at: 0s, open: 1 }
  - { at: 0s, open: 2 }
  - { at: 0s, open: 3 }

expect:
  - { pr: 1, state: merged, queue: default }
  - { pr: 2, state: open, queued: false }
  - { pr: 3, state: open, queued: false }
expect_merged_order: [1]
expect_log:
  - "check `verify-arztagent journeys` completed"
