# Two-step CI with a fixed checks timeout of 10 minutes.
queue_rules:
  - name: default
    merge_method: squash
    checks_timeout: 10 min
    queue_conditions:
      - base = main
      - check-success = quick
    merge_conditions:
      - check-success = full

pull_request_rules:
  - name: queue bot pull requests
    conditions:
      - author = bot
    actions:
      queue:
