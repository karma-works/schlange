# `commit_message_format` with every trailer; the queue command only for alice.
queue_rules:
  - name: default
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers: [co-authored-by, approved-by, merged-by]
    queue_conditions:
      - check-success = quick
    merge_conditions:
      - check-success = full
  - name: plain
    merge_method: squash
    queue_conditions:
      - check-success = quick
      - label = plain
    merge_conditions:
      - check-success = full

pull_request_rules:
  - name: queue bot pull requests
    conditions:
      - author = bot
      - -label = plain
    actions:
      queue:
  - name: queue plain pull requests
    conditions:
      - label = plain
    actions:
      queue:
        name: plain

commands_restrictions:
  queue:
    conditions:
      - sender = alice
