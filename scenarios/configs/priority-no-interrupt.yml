# Priorities without interruption (queue-priority): `urgent` is high, `later` low.
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - base = main
      - check-success = quick
    merge_conditions:
      - check-success = full

priority_rules:
  - name: urgent fixes
    conditions:
      - label = urgent
    priority: 3000
  - name: chores
    conditions:
      - label = later
    priority: low

pull_request_rules:
  - name: queue bot pull requests
    conditions:
      - author = bot
    actions:
      queue:
