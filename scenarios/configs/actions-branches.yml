# Actions that change branches: `update`, `rebase`, `squash`, `close`, `delete_head_branch`,
# `merge` and `github_actions`, next to a queue.
queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - check-success = quick
      - label = queue
    merge_conditions:
      - check-success = quick

pull_request_rules:
  - name: keep up to date
    conditions:
      - label = keep-updated
    actions:
      update:

  - name: keep rebased
    conditions:
      - label = keep-rebased
    actions:
      rebase:

  - name: one commit
    conditions:
      - label = squash-me
    actions:
      squash:
        commit_message: title+body

  - name: no vendor changes
    conditions:
      - files ~= ^vendor/
    actions:
      close:
        message: "@{{ author }}, changes to vendor/ are not accepted here."

  - name: tidy branches
    conditions:
      - closed
    actions:
      delete_head_branch:

  - name: merge docs directly
    conditions:
      - label = docs
      - check-success = quick
    actions:
      merge:
        method: squash

  - name: deploy preview
    conditions:
      - label = preview
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: preview.yml
              inputs:
                pr: "{{ number }}"
                who: "{{ author }}"

  - name: queue
    conditions:
      - label = queue
    actions:
      queue:
