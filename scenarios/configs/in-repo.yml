# The configuration of `p1-config-changed`, kept in `.mergify.yml` on the default branch.
queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - base = main
      - -label = halt
      - check-success = quick
    merge_conditions:
      - check-success = full

pull_request_rules:
  - name: queue bot pull requests
    conditions:
      - author = bot
    actions:
      queue:
