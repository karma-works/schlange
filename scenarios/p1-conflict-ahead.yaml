# Conflicts with a pull request ahead (MQ-27; queue-conflicts `conflict-ahead`, `conflict-base`).
# #2 changes the same file as #1 differently: it is held (CONFLICT_WITH_PULL_AHEAD) and keeps its
# place. When #1 merges, the conflict reaches main and #2 leaves with CONFLICT_WITH_BASE_BRANCH.
# #4 conflicts with #3; #3 is stopped with the label `halt` before it lands, so #4 is released
# and merges. #5 conflicts with main from the start (a direct push changed its file) and leaves
# at once.
name: p1-conflict-ahead
description: Held behind a conflicting pull request; dequeued if it merges, released if it leaves.
config: configs/two-step.yml

ci:
  - check: quick
    duration: 1m
    runs_on: pull_request
  - check: full
    duration: 10m
    runs_on: queue

pull_requests:
  - { number: 1, author: bot, files: { shared.txt: "version by #1\n" } }
  - { number: 2, author: bot, files: { shared.txt: "version by #2\n" } }
  - { number: 3, author: bot, files: { other.txt: "version by #3\n" } }
  - { number: 4, author: bot, files: { other.txt: "version by #4\n" } }
  - { number: 5, author: bot, files: { README.md: "rewritten by #5\n" } }

events:
  - { at: 0s, open: 5 }
  - { at: 30s, push_base: { files: { README.md: "rewritten on main\n" } } }
  - { at: 1m, open: 1 }
  - { at: 1m, open: 2 }
  - { at: 1m, open: 3 }
  - { at: 1m, open: 4 }
  - { at: 5m, label: { pr: 3, name: halt } }

expect:
  - { pr: 1, state: merged }
  - { pr: 2, state: dequeued, reason: CONFLICT_WITH_BASE_BRANCH }
  - { pr: 3, state: dequeued, reason: PR_DEQUEUED }
  - { pr: 4, state: merged }
  - { pr: 5, state: dequeued, reason: CONFLICT_WITH_BASE_BRANCH }
expect_merged_order: [1, 4]
expect_log:
  - "CONFLICT_WITH_PULL_AHEAD"
