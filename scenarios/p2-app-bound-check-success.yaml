# A green check from the required app satisfies the bound requirement.
name: p2-app-bound-check-success
description: The required app's green check satisfies its bound requirement.
config: configs/two-step.yml
bound_required_checks:
  - { context: lint, app_id: 42 }
ci:
  - { check: quick, duration: 1m, runs_on: pull_request }
  - { check: lint, app: test-ci, app_id: 42, duration: 2m, runs_on: both }
  - { check: full, duration: 10m, runs_on: queue }
pull_requests:
  - { number: 1, author: bot, files: { a.txt: "a\n" } }
events:
  - { at: 0s, open: 1 }
expect:
  - { pr: 1, state: merged }
