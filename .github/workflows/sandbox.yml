name: Sandbox

# Integration tests in the GitHub sandbox schlange-sandbox (docs/betrieb/sandbox.md).
# - queue-lab: Mergify active. Records Mergify's behaviour and, for every scenario that
#   has a reviewed baseline in sandbox/baselines/, compares with it (reports when Mergify
#   changes). Scenarios without a baseline are only recorded.
# - schlange-e2e: Schlange active. The job builds the release binary and runs `schlange serve`
#   with the queue app in the runner (no webhooks: it polls by reconciliation every 10 s).
#   Every selected scenario needs a reviewed baseline; a missing baseline or wait timeout fails.
#
# Trigger it, also by agents:
#   gh workflow run sandbox.yml -f repo=queue-lab -f scenarios="s01-single-pr s03-red-batch"
# sandbox/ci/upload-secrets.sh sets the secrets. They only work in schlange-sandbox
# (apps installed there, token limited to the organisation).
# Only workflow_dispatch and schedule: fork PRs never reach this workflow or its secrets.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Sandbox repo
        type: choice
        options: [queue-lab, schlange-e2e]
        default: queue-lab
      scenarios:
        description: Scenarios (file names without .json, separated by spaces) or all
        required: false
        default: s01-single-pr
      update_fixture:
        description: Reset tracked sandbox main files to the fixture after it is idle
        type: boolean
        default: false
  schedule:
    # Sundays: all scenarios on queue-lab, to detect behaviour changes in Mergify.
    - cron: '17 2 * * 0'

permissions:
  contents: read

# One run per sandbox repo; parallel scenarios would end up in each other's batch.
# The driver also waits until no scenario or queue PRs are open any more (local runs).
concurrency:
  group: sandbox-${{ inputs.repo || 'queue-lab' }}
  cancel-in-progress: false

jobs:
  scenarios:
    name: Scenarios ${{ inputs.repo || 'queue-lab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Credentials from the secrets
        env:
          SANDBOX_QUEUE_APP: ${{ secrets.SANDBOX_QUEUE_APP }}
          SANDBOX_QUEUE_PEM: ${{ secrets.SANDBOX_QUEUE_PEM }}
          SANDBOX_QUEUE_WEBHOOK_SECRET: ${{ secrets.SANDBOX_QUEUE_WEBHOOK_SECRET }}
          SANDBOX_DRIVER_APP: ${{ secrets.SANDBOX_DRIVER_APP }}
          SANDBOX_DRIVER_PEM: ${{ secrets.SANDBOX_DRIVER_PEM }}
        run: bash sandbox/ci/write-config.sh
      - name: Reset selected sandbox fixture
        if: ${{ inputs.update_fixture }}
        env:
          GH_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
          SANDBOX_HUMAN_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
          REPO: ${{ inputs.repo }}
        run: bash sandbox/ci/prepare-fixture.sh "$REPO"
      - name: Rust toolchain and cache (schlange-e2e)
        if: ${{ inputs.repo == 'schlange-e2e' }}
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ inputs.repo == 'schlange-e2e' }}
      - name: Build schlange (schlange-e2e)
        if: ${{ inputs.repo == 'schlange-e2e' }}
        run: |
          tools/fetch-mergify-sources || echo "::notice::Mergify sources differ from the lock (see CI job mergify-drift)"
          cargo build --release --locked -p schlange
      - name: Start schlange serve (schlange-e2e)
        if: ${{ inputs.repo == 'schlange-e2e' }}
        run: bash sandbox/ci/start-schlange.sh target/release/schlange
      - name: State of the sandbox
        env:
          SANDBOX_HUMAN_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
        run: python3 -I sandbox/driver/sandbox.py doctor
      - name: Test sandbox driver
        run: |
          python3 -I -m unittest discover -s sandbox/driver -p 'test_*.py'
          python3 -I -m unittest discover -s sandbox/ci/tests -p 'test_*.py'
      - name: Scenarios
        env:
          SANDBOX_HUMAN_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
          SANDBOX_MERGIFY_API_KEY: ${{ secrets.SANDBOX_MERGIFY_API_KEY }}
          REPO: ${{ inputs.repo || 'queue-lab' }}
          SCENARIOS: ${{ inputs.scenarios || 'all' }}
        # Several names become separate arguments.
        run: |
          read -ra names <<<"$SCENARIOS"
          bash sandbox/ci/run-scenarios.sh "$REPO" "${names[@]}"
      - name: Stop schlange serve, show the end of its log
        if: ${{ always() && inputs.repo == 'schlange-e2e' }}
        run: |
          if [ -f "$RUNNER_TEMP/schlange.pids" ]; then xargs -r kill < "$RUNNER_TEMP/schlange.pids" || true; fi
          # The log mentions pull request titles and bodies: the public job log gets only
          # counts. The full log stays in the runner.
          log="$RUNNER_TEMP/schlange-serve.log"
          for k in panic error HALT refused; do
            echo "schlange serve: $(grep -c -i "$k" "$log" 2>/dev/null || true) line(s) with '$k'"
          done
      # Public repo: only our own format, free of text. trace.json and summary.json contain
      # Mergify texts (clean room) and stay in the runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sandbox-runs-${{ inputs.repo || 'queue-lab' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sandbox-runs/*/outcome.json
            ${{ runner.temp }}/sandbox-runs/*/run.json
            ${{ runner.temp }}/sandbox-runs/*/scenario.json
          retention-days: 14
          if-no-files-found: ignore
