name: Sandbox

# Integrationstests in der GitHub-Sandbox schlange-sandbox (docs/betrieb/sandbox.md).
# - queue-lab: Mergify aktiv. Zeichnet Mergifys Verhalten auf und vergleicht es mit den
#   Sollwerten in sandbox/baselines/ (meldet, wenn Mergify sich ändert).
# - schlange-e2e: Schlange aktiv. Kompatibilitätstest gegen dieselben Sollwerte
#   (braucht das Schlange-Binary; bis dahin bricht der Lauf mit klarer Meldung ab).
#
# Auslösen, auch durch Agenten:
#   gh workflow run sandbox.yml -f repo=queue-lab -f scenarios="s01-einzelner-pr s03-rotes-buendel"
# Die Secrets setzt sandbox/ci/upload-secrets.sh. Sie wirken nur in schlange-sandbox
# (Apps dort installiert, Token auf die Organisation begrenzt).
# Nur workflow_dispatch und schedule: Fork-PRs erreichen diesen Workflow und seine Secrets nie.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Sandbox-Repo
        type: choice
        options: [queue-lab, schlange-e2e]
        default: queue-lab
      scenarios:
        description: Szenarien (Dateinamen ohne .json, mit Leerzeichen getrennt) oder all
        required: false
        default: s01-einzelner-pr
  schedule:
    # Sonntags alle Szenarien auf queue-lab: erkennt Verhaltensänderungen von Mergify.
    - cron: '17 2 * * 0'

permissions:
  contents: read

# Ein Lauf pro Sandbox-Repo; parallele Szenarien würden sich gegenseitig ins Bündel geraten.
# Der Driver wartet zusätzlich, bis keine Szenario- oder Queue-PRs mehr offen sind (lokale Läufe).
concurrency:
  group: sandbox-${{ inputs.repo || 'queue-lab' }}
  cancel-in-progress: false

jobs:
  scenarios:
    name: Szenarien ${{ inputs.repo || 'queue-lab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten aus den Secrets
        env:
          SANDBOX_QUEUE_APP: ${{ secrets.SANDBOX_QUEUE_APP }}
          SANDBOX_QUEUE_PEM: ${{ secrets.SANDBOX_QUEUE_PEM }}
          SANDBOX_QUEUE_WEBHOOK_SECRET: ${{ secrets.SANDBOX_QUEUE_WEBHOOK_SECRET }}
          SANDBOX_DRIVER_APP: ${{ secrets.SANDBOX_DRIVER_APP }}
          SANDBOX_DRIVER_PEM: ${{ secrets.SANDBOX_DRIVER_PEM }}
          SANDBOX_SMEE_URL: ${{ vars.SANDBOX_SMEE_URL }}
        run: bash sandbox/ci/write-config.sh
      - name: Stand der Sandbox
        env:
          SANDBOX_HUMAN_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
        run: python3 -I sandbox/driver/sandbox.py doctor
      - name: Szenarien
        env:
          SANDBOX_HUMAN_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
          SANDBOX_MERGIFY_API_KEY: ${{ secrets.SANDBOX_MERGIFY_API_KEY }}
          REPO: ${{ inputs.repo || 'queue-lab' }}
          SCENARIOS: ${{ inputs.scenarios || 'all' }}
        # Mehrere Namen werden einzelne Argumente.
        run: |
          read -ra names <<<"$SCENARIOS"
          bash sandbox/ci/run-scenarios.sh "$REPO" "${names[@]}"
      # Öffentliches Repo: nur das eigene, textfreie Format. trace.json und summary.json enthalten
      # Mergify-Texte (Clean Room) und bleiben im Runner.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-runs-${{ inputs.repo || 'queue-lab' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sandbox-runs/*/outcome.json
            ${{ runner.temp }}/sandbox-runs/*/run.json
            ${{ runner.temp }}/sandbox-runs/*/scenario.json
          retention-days: 14
          if-no-files-found: ignore
