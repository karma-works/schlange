name: Sandbox

# Integration tests in the GitHub sandbox schlange-sandbox (docs/betrieb/sandbox.md).
# - queue-lab: Mergify active. Records Mergify's behaviour and compares it with the
#   baselines in sandbox/baselines/ (reports when Mergify changes).
# - schlange-e2e: Schlange active. Compatibility test against the same baselines
#   (needs the Schlange binary; until then the run aborts with a clear message).
#
# Trigger it, also by agents:
#   gh workflow run sandbox.yml -f repo=queue-lab -f scenarios="s01-single-pr s03-red-batch"
# sandbox/ci/upload-secrets.sh sets the secrets. They only work in schlange-sandbox
# (apps installed there, token limited to the organisation).
# Only workflow_dispatch and schedule: fork PRs never reach this workflow or its secrets.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Sandbox repo
        type: choice
        options: [queue-lab, schlange-e2e]
        default: queue-lab
      scenarios:
        description: Scenarios (file names without .json, separated by spaces) or all
        required: false
        default: s01-single-pr
  schedule:
    # Sundays: all scenarios on queue-lab, to detect behaviour changes in Mergify.
    - cron: '17 2 * * 0'

permissions:
  contents: read

# One run per sandbox repo; parallel scenarios would end up in each other's batch.
# The driver also waits until no scenario or queue PRs are open any more (local runs).
concurrency:
  group: sandbox-${{ inputs.repo || 'queue-lab' }}
  cancel-in-progress: false

jobs:
  scenarios:
    name: Scenarios ${{ inputs.repo || 'queue-lab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Credentials from the secrets
        env:
          SANDBOX_QUEUE_APP: ${{ secrets.SANDBOX_QUEUE_APP }}
          SANDBOX_QUEUE_PEM: ${{ secrets.SANDBOX_QUEUE_PEM }}
          SANDBOX_QUEUE_WEBHOOK_SECRET: ${{ secrets.SANDBOX_QUEUE_WEBHOOK_SECRET }}
          SANDBOX_DRIVER_APP: ${{ secrets.SANDBOX_DRIVER_APP }}
          SANDBOX_DRIVER_PEM: ${{ secrets.SANDBOX_DRIVER_PEM }}
          SANDBOX_SMEE_URL: ${{ vars.SANDBOX_SMEE_URL }}
        run: bash sandbox/ci/write-config.sh
      - name: State of the sandbox
        env:
          SANDBOX_HUMAN_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
        run: python3 -I sandbox/driver/sandbox.py doctor
      - name: Scenarios
        env:
          SANDBOX_HUMAN_TOKEN: ${{ secrets.SANDBOX_HUMAN_TOKEN }}
          SANDBOX_MERGIFY_API_KEY: ${{ secrets.SANDBOX_MERGIFY_API_KEY }}
          REPO: ${{ inputs.repo || 'queue-lab' }}
          SCENARIOS: ${{ inputs.scenarios || 'all' }}
        # Several names become separate arguments.
        run: |
          read -ra names <<<"$SCENARIOS"
          bash sandbox/ci/run-scenarios.sh "$REPO" "${names[@]}"
      # Public repo: only our own format, free of text. trace.json and summary.json contain
      # Mergify texts (clean room) and stay in the runner.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-runs-${{ inputs.repo || 'queue-lab' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sandbox-runs/*/outcome.json
            ${{ runner.temp }}/sandbox-runs/*/run.json
            ${{ runner.temp }}/sandbox-runs/*/scenario.json
          retention-days: 14
          if-no-files-found: ignore
