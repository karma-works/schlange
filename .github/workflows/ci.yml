name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly schema diff against Mergify's published sources (KONZEPT.md, section 4).
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Tests need the schema. Byte drift of the live docs is reported by `mergify-drift`.
      - name: Mergify sources
        run: tools/fetch-mergify-sources || echo "::notice::Mergify sources differ from the lock (see job mergify-drift)"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The release binary without the `localgit` forge must still build and lint.
      - run: cargo clippy -p schlange --locked -- -D warnings
      # The `localgit` tests need git ≥ 2.38 (`merge-tree --write-tree`); ubuntu-latest has it.
      - name: git for the localgit forge
        run: git --version
      # The localgit property test (fixed seed) runs once here, with more cases than its default.
      - name: Tests (coverage test, golden files, scenarios, localgit)
        run: SCHLANGE_LOCALGIT_PBT_CASES=16 cargo test --workspace --locked

  image:
    name: image and size budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t schlange:ci .
      - run: scripts/image-size.sh schlange:ci
      - name: Doctor in the container (health check)
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges schlange:ci doctor

  python:
    name: Python unit tests (scripts, ops, sandbox driver and CI helpers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Hermetic: `gh`, GitHub and the network are mocked; nothing here touches the sandbox.
      - name: unittest
        run: |
          for d in scripts/tests ops/tests sandbox/driver sandbox/ci/tests; do
            python3 -I -m unittest discover -s "$d" -p 'test_*.py'
          done

  readme-status:
    name: README feature status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Status section matches the feature map
        run: python3 -I scripts/feature-status.py --check

  mergify-drift:
    name: Mergify schema diff
    # Weekly (and on demand) only: upstream drift is not caused by a pull request and must not
    # turn unrelated ones red.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Byte changes (docs redeploys) are a notice; a change of the generated inventory
      # (new or removed paths, attributes, actions, enum values, defaults, operations,
      # commands) fails this job: that is the schema diff to act on.
      - name: Download and compare bytes with tools/mergify-sources.lock
        run: tools/fetch-mergify-sources || echo "::notice::Mergify sources changed byte-wise; checking the inventory"
      - name: Inventory unchanged against live Mergify sources
        run: cargo run -q --locked -p inventory -- --check
