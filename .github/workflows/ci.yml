name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly schema diff against Mergify's published sources (KONZEPT.md, section 4).
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The tests need the pinned schema; a source that differs from the lock fails the
      # separate job `mergify-drift`, not this one.
      - name: Mergify sources (pinned)
        run: tools/fetch-mergify-sources || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (coverage test, golden files, scenarios)
        run: cargo test --workspace --locked
      - name: Inventory matches the sources
        run: cargo run -q --locked -p inventory -- --check

  image:
    name: image and size budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t schlange:ci .
      - run: scripts/image-size.sh schlange:ci
      - name: Doctor in the container (health check)
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges schlange:ci doctor

  mergify-drift:
    name: Mergify schema diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and compare with tools/mergify-sources.lock
        run: tools/fetch-mergify-sources
