# The agent ticks the "queue" checkbox on its own constitution PR (and later the requeue box
# after a dequeue). The checkbox must obey commands_restrictions like the comment does.
name: a4-agent-ticks-checkbox
description: agent may not queue a constitution PR via the checkbox
config: /home/ubuntu/Projects/schlange/.claude/worktrees/agent-ae7a951a5462d5f29/crates/schlange-config/tests/golden/arztagent.yml
permissions: { arztagent-bot: write, karma-works: admin }
ci:
  - { check: Risk class and data protection, duration: 1m }
  - { check: ci-ok, duration: 3m, runs_on: pull_request }
  - { check: ci-ok, duration: 20m, runs_on: queue }
  - { check: KI-Review, duration: 5m, runs_on: pull_request }
pull_requests:
  - number: 1
    author: arztagent-bot
    files: { .github/workflows/ci.yml: "on: [pull_request]\n" }
events:
  - { at: 0s, open: 1 }
  - { at: 10m, tick: { pr: 1, by: arztagent-bot, checkbox: queue } }
  - { at: 20m, tick: { pr: 1, by: arztagent-bot, checkbox: requeue } }
expect:
  - { pr: 1, state: open }
