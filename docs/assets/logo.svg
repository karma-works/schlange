<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">Schlange</title>
  <!-- A snake whose segmented body is a queue of pull requests; its tail runs into main. -->
  <rect width="128" height="128" rx="28" fill="#0e3b2c"/>
  <!-- main: the line every queued change lands on -->
  <path d="M18 100 H110" stroke="#2f6b52" stroke-width="4" stroke-linecap="round"/>
  <circle cx="86" cy="100" r="5" fill="#0e3b2c" stroke="#7fd99a" stroke-width="3"/>
  <circle cx="104" cy="100" r="5" fill="#0e3b2c" stroke="#7fd99a" stroke-width="3"/>
  <!-- body -->
  <path id="body" d="M70 100 C40 100 26 88 30 72 C34 56 92 64 96 46 C100 30 76 22 58 30"
        fill="none" stroke="#7fd99a" stroke-width="15" stroke-linecap="round"/>
  <!-- segment gaps: each segment is one pull request -->
  <path d="M70 100 C40 100 26 88 30 72 C34 56 92 64 96 46 C100 30 76 22 58 30"
        fill="none" stroke="#0e3b2c" stroke-width="16" stroke-dasharray="2.5 17" stroke-dashoffset="-12"/>
  <!-- head -->
  <ellipse cx="50" cy="34" rx="13" ry="11" transform="rotate(-20 50 34)" fill="#7fd99a"/>
  <circle cx="46" cy="30" r="2.6" fill="#0e3b2c"/>
  <!-- tongue -->
  <path d="M38 39 L30 42 M30 42 L25 39 M30 42 L26 46" stroke="#f2b84b" stroke-width="2.4"
        stroke-linecap="round" fill="none"/>
</svg>
