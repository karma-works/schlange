# Produces real Dependabot PRs: ms (patch), semver (minor), is-number (major),
# actions/checkout in workflows (constitution path .github/, not queued automatically).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
