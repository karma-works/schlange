name: CI

# Imitation of arzt-agent/.github/workflows/ci.yml: one required result `ci-ok`.
# PR: quick check (light). Queue PR (head mergify/merge-queue/*): full suite (full).
# What the suite does is controlled by flag files under ci/flags/ that the PR itself changes
# (see ci/run.sh). Flags on main no longer have any effect.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mode and flags
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ] && [[ "$HEAD_REF" != mergify/merge-queue/* ]]; then mode=light; else mode=full; fi
          echo "Mode: $mode"
          bash ci/run.sh "$mode" "${BASE:-}" "${HEAD:-}"

  # Red on any failure or abort; not reported if the whole run was cancelled.
  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() }}
    needs: [suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.suite.result }}
        run: |
          echo "suite: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::Not green: suite"; exit 1; }
